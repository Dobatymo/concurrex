[build-system]
build-backend = "flit_core.buildapi"
requires = [
  "flit-core<4,>=3.2",
]

[project]
name = "concurrex"
readme = "readme.md"
license = { file = "LICENSE" }
authors = [
  { name = "Dobatymo", email = "dobatymo@users.noreply.github.com" },
]
requires-python = ">=3.8"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "description",
  "version",
]
dependencies = [
  "genutility[callbacks,concurrency,time]>=0.0.117",
  "rich",
  "typing-extensions>=4",
]
optional-dependencies.fast = [
  "atomicarray>=0.0.1",
]
urls.Home = "https://github.com/Dobatymo/concurrex"

[dependency-groups]
dev = [
  "genutility[test]>=0.0.103",
  "mypy>=1.14.1",
  "pytest>=8.3.5",
  "pytest-subtests>=0.13.1",
]

[tool.ruff]
line-length = 120
lint.extend-select = [ "B", "C4", "DTZ", "I", "PIE", "S", "SIM", "UP" ]
lint.ignore = [ "B011", "B904", "BLE001", "S101", "SIM108", "SIM110" ]
lint.pyupgrade.keep-runtime-typing = true

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true

[tool.pytest]
ini_options.log_format = """\
  %(asctime)s %(levelname)-8s %(threadName)s %(name)s:%(filename)s:%(lineno)d %(object)s %(message)s\
  """  # or log_cli_format
ini_options.log_date_format = "%Y-%m-%d %H:%M:%S"  # or log_cli_date_format
ini_options.log_level = "DEBUG"  # or log_cli_level
ini_options.log_cli = true
